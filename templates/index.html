<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج IPGEI</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .results {
            margin-top: 25px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>نتائج مسابقة IPGEI</h1>
        
        <form method="POST" action="/">
            <input type="text" name="search" placeholder="أدخل الرقم أو الاسم للبحث..." required>
            <button type="submit">بحث عن النتيجة</button>
        </form>

        <div class="results">
            {% if result %}
                <h3>نتيجة البحث:</h3>
                <div>{{ result | safe }}</div>
            {% endif %}
        </div>
    </div>

</body>
</html>
